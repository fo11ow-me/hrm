name: Dev CI/CD

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: dev-deployment
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVER_IMAGE: ghcr.io/fo11ow-me/hrm-server
  ADMIN_IMAGE: ghcr.io/fo11ow-me/hrm-admin

jobs:
  security:
    name: Security gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Check forbidden files and metadata
        run: bash scripts/ci-security-scan.sh

      - name: Scan secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: "false"

  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: hrm-server/pom.xml

      - name: Run unit tests
        working-directory: hrm-server
        run: mvn -B -DskipITs=true test

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    needs: security
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: hrm-server/pom.xml

      - name: Initialize test schemas
        env:
          CI_DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: MYSQL_PWD="$CI_DB_PASSWORD" mysql --host=127.0.0.1 --user=root < deploy/ci/init-test-db.sql

      - name: Generate disposable JWT secret
        run: |
          jwt_secret="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$jwt_secret"
          printf 'TEST_JWT_SECRET=%s\n' "$jwt_secret" >> "$GITHUB_ENV"

      - name: Run integration tests
        working-directory: hrm-server
        env:
          TEST_DB_MASTER_URL: jdbc:mysql://127.0.0.1:3306/hrm?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
          TEST_DB_ACTIVITI_URL: jdbc:mysql://127.0.0.1:3306/hrm_activiti?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          TEST_REDIS_HOST: 127.0.0.1
          TEST_REDIS_PORT: "6379"
          TEST_REDIS_PASSWORD: ""
        run: mvn -B -DskipUTs=true verify

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hrm-admin/package-lock.json

      - name: Install dependencies
        working-directory: hrm-admin
        run: npm ci

      - name: Build frontend
        working-directory: hrm-admin
        env:
          VUE_APP_BASE_API: /api
        run: npm run build

  compose:
    name: Validate production Compose
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Validate Compose without rendering secrets
        working-directory: deploy
        run: |
          cp .env.example .env
          cp release.env.example release.env
          docker compose --env-file .env --env-file release.env -f docker-compose.prod.yml config --quiet

  publish:
    name: Publish images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [backend-unit, backend-integration, frontend, compose]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: hrm-server
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:sha-${{ github.sha }}
            ${{ env.SERVER_IMAGE }}:dev
          cache-from: type=gha,scope=hrm-server
          cache-to: type=gha,mode=max,scope=hrm-server

      - name: Build and push frontend
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: hrm-admin
          push: true
          tags: |
            ${{ env.ADMIN_IMAGE }}:sha-${{ github.sha }}
            ${{ env.ADMIN_IMAGE }}:dev
          cache-from: type=gha,scope=hrm-admin
          cache-to: type=gha,mode=max,scope=hrm-admin

  deploy:
    name: Deploy dev
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: publish
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HEALTHCHECK_URL: ${{ secrets.DEPLOY_HEALTHCHECK_URL }}
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_PRIVATE_KEY DEPLOY_KNOWN_HOSTS DEPLOY_HEALTHCHECK_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required dev environment secret is not configured: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          echo "::add-mask::$DEPLOY_HOST"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Upload deployment files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/hrm}"
          ssh -i "$HOME/.ssh/id_deploy" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'" >/dev/null 2>&1
          scp -i "$HOME/.ssh/id_deploy" -P "$DEPLOY_PORT" deploy/docker-compose.prod.yml deploy/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/" >/dev/null 2>&1

      - name: Deploy immutable release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/hrm}"
          ssh -i "$HOME/.ssh/id_deploy" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_DIR='$DEPLOY_PATH' bash '$DEPLOY_PATH/deploy.sh' 'sha-${GITHUB_SHA}'" >/dev/null

      - name: Verify public health endpoint
        env:
          DEPLOY_HEALTHCHECK_URL: ${{ secrets.DEPLOY_HEALTHCHECK_URL }}
        run: |
          if ! curl --fail --silent --output /dev/null "$DEPLOY_HEALTHCHECK_URL"; then
            echo "public health check failed" >&2
            exit 1
          fi
