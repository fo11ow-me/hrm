server:
  port: ${SERVER_PORT:8888}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  datasource:
    master:
      jdbc-url: ${DB_MASTER_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
      type: com.zaxxer.hikari.HikariDataSource
    activiti:
      jdbc-url: ${DB_ACTIVITI_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
      type: com.zaxxer.hikari.HikariDataSource

  activiti:
    database-schema-update: ${ACTIVITI_SCHEMA_UPDATE:true}
    history-level: full
    db-history-used: true

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:30MB}

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}
    database: ${REDIS_DATABASE:0}
    lettuce:
      pool:
        max-idle: 16
        max-active: 32
        min-idle: 8

  mvc:
    pathmatch:
      matching-strategy: ant-path-matcher

  main:
    allow-bean-definition-overriding: true

mybatis-plus:
  configuration:
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  type-enums-package: com.qiujie.enums
  mapper-locations: classpath:mapper/*.xml

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

file-path: ${FILE_STORAGE_PATH:/opt/app/hrm/files}

oss:
  endpoint: ${OSS_ENDPOINT:}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  bucket-name: ${OSS_BUCKET_NAME:}

jwt:
  secret: ${JWT_SECRET}

staff:
  default-password: ${STAFF_DEFAULT_PASSWORD:123}

assistant:
  enabled: ${ASSISTANT_ENABLED:false}
  timeout-seconds: ${ASSISTANT_TIMEOUT_SECONDS:15}
  retention-days: ${ASSISTANT_RETENTION_DAYS:30}
  provider:
    base-url: ${ASSISTANT_PROVIDER_BASE_URL:}
    api-key: ${ASSISTANT_PROVIDER_API_KEY:}
    model: ${ASSISTANT_PROVIDER_MODEL:}

